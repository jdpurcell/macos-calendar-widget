name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z (for example, v1.2.3)." >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "dmg_path=dist/CalendarWidget-${tag}.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          xcodebuild \
            -project CalendarWidget.xcodeproj \
            -scheme CalendarWidget \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sign, package, and notarize DMG
        shell: pwsh
        env:
          APPLE_DEVID_APP_CERT_DATA: ${{ secrets.APPLE_DEVID_APP_CERT_DATA }}
          APPLE_DEVID_APP_CERT_PASS: ${{ secrets.APPLE_DEVID_APP_CERT_PASS }}
          APPLE_ID_USER: ${{ secrets.APPLE_ID_USER }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          DMG_PATH: ${{ steps.release.outputs.dmg_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('APPLE_DEVID_APP_CERT_DATA', 'APPLE_DEVID_APP_CERT_PASS', 'APPLE_ID_USER', 'APPLE_ID_PASS')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Missing required secret: $name"
            }
          }

          $originalKeychain = (& security default-keychain -d user).Trim().Trim('"')
          $originalKeychain | Set-Content (Join-Path $env:RUNNER_TEMP 'original-default-keychain.txt')
          # Keep both calls in the same process: the installer exports the cert name here.
          & .github/scripts/install_cert.ps1
          bash .github/scripts/package_dmg.sh "build/Build/Products/Release/CalendarWidget.app" "$env:DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget-${{ steps.release.outputs.tag }}-DMG
          path: ${{ steps.release.outputs.dmg_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.dmg_path }}" \
            --verify-tag \
            --title "Calendar Widget ${{ steps.release.outputs.tag }}" \
            --generate-notes

      - name: Clean up signing credentials
        if: always()
        run: |
          set -euo pipefail
          original_keychain_file="$RUNNER_TEMP/original-default-keychain.txt"
          if [ -f "$original_keychain_file" ]; then
            security default-keychain -d user -s "$(cat "$original_keychain_file")"
          fi
          if [ -f "$RUNNER_TEMP/codesign.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/codesign.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/codesign.p12" "$original_keychain_file"
