name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
            range="HEAD"
            summary="Initial release"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
            range="${latest_tag}..HEAD"
            summary="Changes since ${latest_tag}"
          fi

          if git rev-parse -q --verify "refs/tags/${next_tag}" >/dev/null; then
            echo "Tag ${next_tag} already exists." >&2
            exit 1
          fi

          {
            echo "tag=${next_tag}"
            echo "dmg_path=dist/CalendarWidget-${next_tag}.dmg"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Calendar Widget ${next_tag}"
            echo
            echo "${summary}"
            echo
            echo "### Changelog"
            echo
            git log --format='- %s (%h)' --reverse "$range"
          } > release-notes.md

          if ! grep -q '^- ' release-notes.md; then
            echo "- No commit messages found." >> release-notes.md
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project CalendarWidget.xcodeproj \
            -scheme CalendarWidget \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Sign, package, and notarize DMG
        shell: pwsh
        env:
          APPLE_DEVID_APP_CERT_DATA: ${{ secrets.APPLE_DEVID_APP_CERT_DATA }}
          APPLE_DEVID_APP_CERT_PASS: ${{ secrets.APPLE_DEVID_APP_CERT_PASS }}
          APPLE_ID_USER: ${{ secrets.APPLE_ID_USER }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          DMG_PATH: ${{ steps.release.outputs.dmg_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('APPLE_DEVID_APP_CERT_DATA', 'APPLE_DEVID_APP_CERT_PASS', 'APPLE_ID_USER', 'APPLE_ID_PASS')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "Missing required secret: $name"
            }
          }

          $originalKeychain = (& security default-keychain -d user).Trim().Trim('"')
          $originalKeychain | Set-Content (Join-Path $env:RUNNER_TEMP 'original-default-keychain.txt')
          # Keep both calls in the same process: the installer exports the cert name here.
          & .github/scripts/install_cert.ps1
          bash .github/scripts/package_dmg.sh "build/Build/Products/Release/CalendarWidget.app" "$env:DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget-${{ steps.release.outputs.tag }}-DMG
          path: ${{ steps.release.outputs.dmg_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.dmg_path }}" \
            --target "$GITHUB_SHA" \
            --title "Calendar Widget ${{ steps.release.outputs.tag }}" \
            --notes-file release-notes.md

      - name: Clean up signing credentials
        if: always()
        run: |
          set -euo pipefail
          original_keychain_file="$RUNNER_TEMP/original-default-keychain.txt"
          if [ -f "$original_keychain_file" ]; then
            security default-keychain -d user -s "$(cat "$original_keychain_file")"
          fi
          if [ -f "$RUNNER_TEMP/codesign.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/codesign.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/codesign.p12" "$original_keychain_file"
